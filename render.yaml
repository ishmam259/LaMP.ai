# Public demo for AIgnite: one PostgreSQL database, the API and the frontend on Render's free plans.
# Photos and chat use the real OpenAI API (set OPENAI_API_KEY in the dashboard; never commit it).
# The demo photos and the chat's suggested questions are served from their recordings, free;
# anything new calls OpenAI until the day's spend reaches LLM_DAILY_BUDGET_USD.
# Demo controls are on, reset loads the demo captures, and the demo puts itself back every 60 minutes.
# Free plans: services sleep after 15 minutes without visitors (about a minute to wake), and the
# free database expires 30 days after it is created.
databases:
  - name: lamp-ai-db
    plan: free
    databaseName: lamp
    user: lamp

services:
  - type: web
    name: lamp-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lamp-ai-db
          property: connectionString
      - key: REGISTRY_KEY
        generateValue: true
      - key: DEV_MODE
        value: "true"
      - key: DEMO_RESET_WITH_CAPTURES
        value: "true"
      - key: DEMO_AUTO_RESET_MINUTES
        value: "60"
      - key: LLM_MODE
        value: live
      - key: OPENAI_API_KEY
        sync: false   # your OpenAI key, entered in the Render dashboard
      - key: LLM_DAILY_BUDGET_USD
        value: "1.00"
      - key: CORS_ORIGINS
        sync: false   # e.g. ["https://lamp-ai-web.onrender.com"]
      - key: BREVO_API_KEY
        sync: false   # optional crash alerts
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false

  - type: web
    name: lamp-ai-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Baked in at build time (Next.js rewrites). Render passes env vars to the Docker build as
      # build args. Set it to the API's URL once lamp-ai-api exists, e.g. https://lamp-ai-api.onrender.com
      - key: BACKEND_URL
        sync: false
